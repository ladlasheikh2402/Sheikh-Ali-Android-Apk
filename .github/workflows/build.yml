name: Build Android (APK + AAB)

# GitHub -> Actions -> "Build Android (APK + AAB)" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose the "executable" flag
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Uses your own key when the secrets KEYSTORE_BASE64, KS_PASS, KEY_ALIAS exist,
      # otherwise creates a temporary key (fine for testing, NOT for Google Play updates).
      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KS_PASS }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KS_PASS_SECRET"; ALIAS="$KEY_ALIAS_SECRET"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 -alias ladla \
              -storepass ladla123456 -keypass ladla123456 \
              -dname "CN=Ladla Sheikh, O=Ladla Sheikh, C=PK"
            PASS="ladla123456"; ALIAS="ladla"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ladla-Sheikh-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Ladla-Sheikh-AAB
          path: app/build/outputs/bundle/release/*.aab
